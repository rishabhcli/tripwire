[project]
name = "tripwire"
version = "0.1.0"
description = "Review untrusted code by running it in a Vultr-hosted sandbox, with a measured ablation of each containment guard."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon and the tripwire-sandbox image"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tripwire"]

[tool.setuptools.package-data]
tripwire = ["static/*", "fixtures/hostile/*.py", "runtime/*.py"]
